[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-localbiz-official"
version = "0.1.0"
description = "Executa for the localbiz-official Anna App"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-localbiz-official" = "localbiz_official_plugin:main"

[tool.setuptools]
py-modules = ["localbiz_official_plugin"]
